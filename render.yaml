# Render Infrastructure Blueprint for NexusCore
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: nexuscore-backend
    runtime: python
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:$PORT app.main:app
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: nexuscore-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: PLATFORM_COMMISSION_PERCENTAGE
        value: "10.0"
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: FIRST_SUPERUSER_EMAIL
        sync: false
      - key: FIRST_SUPERUSER_PASSWORD
        sync: false
      - key: PAYMENT_PROVIDER
        value: test
      - key: SEED_DEMO_DATA
        value: "false"

databases:
  - name: nexuscore-postgres
    databaseName: nexuscore
    user: nexuscore
    region: oregon
    plan: starter
